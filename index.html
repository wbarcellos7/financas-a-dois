<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030d09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças a Dois">
<title>Finanças a Dois</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#030d09;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.075);--bd2:rgba(52,211,153,.28);--tx:#ecfdf5;--tx2:#c7dcd3;--mut:#7f9a8f;--acc:#10b981;--acc2:#6ee7b7;--acc3:#047857;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--pink:#fb7185;--sav:#5eead4;--r:20px;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 16px 40px -12px rgba(0,0,0,.6)}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:contain;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.val,.big,.mini b,.gnum,.kv b,.lim b,.mpill span{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(900px 520px at 100% -8%,rgba(16,185,129,.20),transparent 60%),radial-gradient(700px 480px at -15% 28%,rgba(4,120,87,.16),transparent 60%),radial-gradient(600px 400px at 50% 110%,rgba(16,185,129,.08),transparent 60%),linear-gradient(180deg,#04120d,#020a07)}
.bgfx:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%)}
.blob{display:none}
.glass,.card,nav,.sheet,header{backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--sh)}
header{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:10px;background:rgba(3,13,9,.72);border-bottom:1px solid var(--bd)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(140deg,#34d399,#047857);display:grid;place-items:center;box-shadow:0 6px 18px -4px rgba(16,185,129,.6)}
.logo svg{width:20px;height:20px}
.brand div{min-width:0}
header h1{font-size:16px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-size:11.5px;color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpill{display:flex;align-items:center;gap:0;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:2px}
.mpill button{background:none;border:0;width:28px;height:30px;border-radius:9px;font-size:17px;cursor:pointer;color:var(--tx2)}
.mpill button:active{background:rgba(255,255,255,.08)}
.mpill span{font-size:12.5px;font-weight:600;min-width:62px;text-align:center}
.syncb{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--tx2)}
.syncb svg{width:17px;height:17px}
.syncb i{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:#4b5f57;border:2px solid var(--bg)}
.syncb i.on{background:var(--ok)}.syncb i.pend{background:var(--warn)}.syncb i.err{background:var(--bad)}
.syncb.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main{padding:2px 18px 18px;max-width:720px;margin:0 auto}
main>*{animation:up .35s ease both}
h2{font-size:14.5px;font-weight:650;letter-spacing:-.1px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h2 small,.mut{color:var(--mut);font-weight:500;font-size:12.5px}
.lnk{color:var(--acc2);font-size:12.5px;font-weight:600;background:none;border:0;cursor:pointer;white-space:nowrap}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#065f46 0%,#047857 38%,#10b981 100%);border:1px solid rgba(110,231,183,.35);box-shadow:0 24px 48px -18px rgba(16,185,129,.55),0 1px 0 rgba(255,255,255,.25) inset}
.hero:before{content:"";position:absolute;width:320px;height:320px;right:-120px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero:after{content:"";position:absolute;width:260px;height:260px;left:-120px;bottom:-170px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}
.hero>*{position:relative;z-index:1}
.hero .lbl{color:rgba(236,253,245,.82);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.9px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1.4px;margin:2px 0 4px;color:#fff}
.hero .mut{color:rgba(236,253,245,.78)}
.hero .mut b{color:#fff}
.hero .mini{background:rgba(2,44,34,.28);border-color:rgba(255,255,255,.14)}
.hero .mini span{color:rgba(236,253,245,.75)}
.hero .mini b,.hero .mini b.pos,.hero .mini b.sav{color:#fff!important}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:14px;padding:9px 10px;min-width:0}
.mini b{display:block;font-size:13px;font-weight:700;margin-top:1px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini span{font-size:11px;color:var(--mut);font-weight:500}
.mini span:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:currentColor;opacity:.9}
.row3 .mini:nth-child(1) span:before{background:#6ee7b7}.row3 .mini:nth-child(2) span:before{background:#fda4af}.row3 .mini:nth-child(3) span:before{background:#99f6e4}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.qa button{border:1px solid var(--bd);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border-radius:18px;padding:14px 6px 12px;font-weight:600;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tx2);transition:transform .15s}
.qa button:active{transform:scale(.97)}
.qa button em{font-style:normal;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.qa button em svg{width:21px;height:21px}
.qa button:nth-child(1) em{background:rgba(251,113,133,.14);color:#fda4af}
.qa button:nth-child(2) em{background:rgba(52,211,153,.15);color:#6ee7b7}
.qa button:nth-child(3) em{background:rgba(94,234,212,.13);color:#99f6e4}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055);cursor:pointer}
.list .it:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:rgba(255,255,255,.06)}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .tx span{font-size:12px;color:var(--mut)}
.val{font-weight:700;white-space:nowrap;font-size:14.5px}.pos{color:var(--ok)}.neg{color:var(--tx)}.sav{color:var(--sav)}
.chip{font-size:10.5px;font-weight:650;padding:3px 8px;border-radius:999px;white-space:nowrap;display:inline-block;letter-spacing:.1px}
.chip.ok{background:rgba(52,211,153,.13);color:var(--ok)}.chip.warn{background:rgba(251,191,36,.13);color:var(--warn)}.chip.bad{background:rgba(248,113,113,.14);color:var(--bad)}.chip.info{background:rgba(255,255,255,.07);color:var(--tx2)}
.btn{border:1px solid var(--bd);background:var(--card2);border-radius:13px;padding:11px 14px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#10b981,#059669);border-color:rgba(110,231,183,.35);color:#fff;box-shadow:0 10px 24px -8px rgba(16,185,129,.65),0 1px 0 rgba(255,255,255,.25) inset}
.btn.danger{background:rgba(248,113,113,.1);color:var(--bad);border-color:rgba(248,113,113,.28)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.wide{width:100%;margin-top:10px}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.gcard{flex:0 0 158px;scroll-snap-align:start;background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:18px;padding:12px 10px;text-align:center;cursor:pointer}
.gcard b{display:block;font-size:13px;font-weight:600}.gcard small{color:var(--mut);font-size:11px;display:block}
.gnum{margin-top:-30px;font-weight:800;font-size:15px;margin-bottom:2px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#059669,#34d399)}
.bar i.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.bar i.bad{background:linear-gradient(90deg,#ef4444,#f87171)}.bar i.ok{background:linear-gradient(90deg,#10b981,#6ee7b7)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.85}
.lim{margin:12px 0}.lim .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--bd);border-radius:18px;padding:16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.tile:active{transform:scale(.98);border-color:var(--bd2)}
.tile em{font-style:normal;font-size:20px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(16,185,129,.12);margin-bottom:6px}
.tile b{font-size:14px;font-weight:650}.tile span{font-size:12px;color:var(--mut)}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--mut);transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 12px -4px rgba(16,185,129,.7)}
.dayh{font-size:11px;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.8px;margin:16px 0 2px}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:13.5px}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid rgba(52,211,153,.6);display:grid;place-items:center;flex:none;font-size:13px}
.chk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.done b{text-decoration:line-through;opacity:.5}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.donutw{display:flex;align-items:center;gap:16px}.donutw svg{flex:none}
.catl{flex:1;min-width:0}.catl div{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}.catl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--acc2);font-weight:600;padding:12px 0 0;cursor:pointer}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:space-around;align-items:center;background:rgba(6,22,16,.82);border:1px solid var(--bd);border-radius:22px;padding:6px;max-width:520px;margin:0 auto;box-shadow:0 18px 40px -10px rgba(0,0,0,.7)}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mut);padding:7px 8px 6px;border-radius:14px;cursor:pointer;min-width:58px;transition:color .2s,background .2s}
nav button svg{width:21px;height:21px}
nav button.on{color:var(--acc2);background:rgba(16,185,129,.12)}
nav .fab{width:54px;height:54px;min-width:54px;border-radius:18px;background:linear-gradient(140deg,#34d399,#059669);color:#fff;margin-top:-30px;box-shadow:0 14px 28px -8px rgba(16,185,129,.8),0 1px 0 rgba(255,255,255,.35) inset;border:1px solid rgba(255,255,255,.2);justify-content:center}
nav .fab svg{width:26px;height:26px}
.ov{position:fixed;inset:0;background:rgba(0,6,4,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92vh;overflow-y:auto;background:rgba(7,24,18,.94);border:1px solid var(--bd);border-top-color:var(--bd2);border-bottom:0;border-radius:26px 26px 0 0;padding:6px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;overscroll-behavior:contain;box-shadow:0 -20px 50px -10px rgba(0,0,0,.6)}
.sheet.on{transform:translateY(0)}
.grab{position:sticky;top:0;padding:8px 0 14px;display:flex;justify-content:center;cursor:grab;touch-action:none;z-index:2}
.grab i{width:40px;height:5px;border-radius:99px;background:rgba(255,255,255,.22)}
.sheet h3{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:14px}
.fld{margin-bottom:13px}.fld label{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.fld input,.fld select,.fld textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:12px;padding:12px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.fld select option{background:#07180f}
.fld input.big{font-size:32px;font-weight:800;text-align:center;padding:14px;letter-spacing:-.8px}
.fld input[type=color]{height:44px;padding:4px}
.tg{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.2);border:1px solid var(--bd);border-radius:12px;padding:11px 13px}
.tg input{width:auto;accent-color:var(--acc)}
.ptr{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));z-index:15;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#0a2219;border:1px solid var(--bd2);color:var(--acc2);display:grid;place-items:center;font-size:18px;transform:translateY(-80px);opacity:0;transition:opacity .2s}
.ptr.ld span{display:inline-block;animation:spin .8s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#0b2a1f;border:1px solid var(--bd2);padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
pre.code{background:rgba(0,0,0,.4);border:1px solid var(--bd);border-radius:12px;padding:12px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:240px;overflow:auto;white-space:pre;color:#a7f3d0}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0}
.steps{padding-left:18px;font-size:13px;color:var(--mut)}.steps li{margin:5px 0}.steps b{color:var(--tx)}
.ccard{border-radius:18px;padding:16px;margin:12px 0;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.16);cursor:pointer;box-shadow:0 18px 36px -16px rgba(0,0,0,.7)}
.ccard:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 45%),radial-gradient(circle at 110% 120%,rgba(0,0,0,.35),transparent 60%);pointer-events:none}
.ccard .t{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.ccard .s{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;opacity:.92}
.offb{background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.35);color:#fde68a;font-size:12px;text-align:center;padding:6px;border-radius:12px;margin-top:12px;display:none}
@media (min-width:700px){.grid2{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="bgfx"></div>
<div class="ptr" id="ptr"><span>↻</span></div>
<header>
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></svg></div><div><h1 id="ttl">Finanças a Dois</h1><small id="sttl"></small></div></div>
  <div class="mpill" id="mpill"><button onclick="mudaMes(-1)" aria-label="Mês anterior">‹</button><span id="mlbl"></span><button onclick="mudaMes(1)" aria-label="Próximo mês">›</button></div>
  <button class="syncb" id="syncb" onclick="syncNow(true)" aria-label="Sincronizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg><i id="sdot"></i></button>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-t="extrato" onclick="go('extrato')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Extrato</button>
  <button class="fab" onclick="novoLanc('gasto')" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="contas" onclick="go('contas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Contas</button>
  <button data-t="mais" onclick="go('mais')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Mais</button>
</nav>
<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grab" id="grab"><i></i></div><div id="shb"></div></div>
<div class="toast" id="toast"></div>

<script type="text/plain" id="gsCode">/**
 * Finanças a Dois — backend Google Sheets (Apps Script)
 * 1) Crie uma planilha no Google Sheets
 * 2) Extensões > Apps Script > cole este código
 * 3) Troque a CHAVE abaixo (use a mesma no app dos dois celulares)
 * 4) Implantar > Nova implantação > Tipo: App da Web
 *    Executar como: Eu | Quem pode acessar: Qualquer pessoa

const CHAVE = '2nZyzCjvo5DGfP0bpsjigZbUWapPJlA2';
const COLS = ['lanc','contas','fixas','cartoes','bancos','metas','tarefas','cats','resgates'];
const NOMES = {lanc:'Lançamentos',contas:'Contas',fixas:'Contas Fixas',cartoes:'Cartões',bancos:'Bancos',metas:'Metas',tarefas:'Tarefas',cats:'Categorias',resgates:'Resgates'};

function doGet(e) {
  if ((e.parameter.token || '') !== CHAVE) return out({ error: 'chave inválida' });
  return out({ data: lerDB() });
}

function doPost(e) {
  const body = JSON.parse(e.postData.contents);
  if (body.token !== CHAVE) return out({ error: 'chave inválida' });
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const merged = mesclar(lerDB(), body.data || {});
    salvarDB(merged);
    escreverAbas(merged);
    return out({ ok: true, data: merged });
  } finally {
    lock.releaseLock();
  }
}

function mesclar(a, b) {
  const r = { del: Object.assign({}, a.del || {}) };
  Object.keys(b.del || {}).forEach(k => { r.del[k] = Math.max(r.del[k] || 0, b.del[k]); });
  COLS.forEach(c => {
    const m = {};
    (a[c] || []).forEach(x => m[x.id] = x);
    (b[c] || []).forEach(x => { if (!m[x.id] || (x.u || 0) > (m[x.id].u || 0)) m[x.id] = x; });
    r[c] = Object.keys(m).map(k => m[k]).filter(x => !(r.del[x.id] >= (x.u || 0)));
  });
  const ca = a.cfg || { u: 0 }, cb = b.cfg || { u: 0 };
  r.cfg = (cb.u || 0) > (ca.u || 0) ? cb : ca;
  return r;
}

function aba(nome) {
  const ss = SpreadsheetApp.getActive();
  return ss.getSheetByName(nome) || ss.insertSheet(nome);
}

function lerDB() {
  const sh = aba('_db');
  const n = sh.getLastRow();
  if (!n) return {};
  const txt = sh.getRange(1, 1, n, 1).getValues().map(r => r[0]).join('');
  try { return JSON.parse(txt); } catch (err) { return {}; }
}

function salvarDB(obj) {
  const sh = aba('_db');
  const s = JSON.stringify(obj), parts = [];
  for (let i = 0; i < s.length; i += 45000) parts.push([s.slice(i, i + 45000)]);
  sh.clear();
  if (parts.length) sh.getRange(1, 1, parts.length, 1).setValues(parts);
  sh.hideSheet();
}

function escreverAbas(d) {
  COLS.forEach(c => {
    const rows = d[c] || [];
    const sh = aba(NOMES[c]);
    sh.clear();
    if (!rows.length) return;
    const keys = [];
    rows.forEach(r => Object.keys(r).forEach(k => { if (k !== 'u' && keys.indexOf(k) < 0) keys.push(k); }));
    const vals = [keys].concat(rows.map(r => keys.map(k => r[k] === undefined ? '' : (typeof r[k] === 'object' ? JSON.stringify(r[k]) : r[k]))));
    sh.getRange(1, 1, vals.length, keys.length).setValues(vals);
    sh.getRange(1, 1, 1, keys.length).setFontWeight('bold').setBackground('#0b2a6b').setFontColor('#ffffff');
    sh.setFrozenRows(1);
  });
}

function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function fieldHtml(f,v){

  switch(f.t){
    case'money':return`<input name="${f.k}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${v===''||v==null?'':String(v).replace('.',',')}" class="${f.big?'big':''}">`;
    case'num':return`<input name="${f.k}" type="number" inputmode="decimal" step="any" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
    case'date':return`<input name="${f.k}" type="date" value="${esc(v)}">`;

    case'color':return`<input name="${f.k}" type="color" value="${esc(v||'#10b981')}">`;

    case'seg':return`<div class="seg" data-v="${esc(v)}">${opts.map(([a,b])=>`<button type="button" data-v="${esc(a)}" class="${String(a)===String(v)?'on':''}" onclick="segPick(this)">${esc(b)}</button>`).join('')}</div>`;

function formSheet(o){

/* ---- Convite: link com URL + chave no fragmento (#), que não é enviado a nenhum servidor ---- */
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function linkConvite(){return location.origin+location.pathname+'#conectar='+b64e(JSON.stringify({u:S.cfg.url,t:S.cfg.token,n:S.cfg.nomes}))}
function convidar(){const url=linkConvite(),txt='Vamos organizar nossas finanças juntos 💙 Abra este link no Safari/Chrome para conectar o app à nossa planilha:';
  if(navigator.share)navigator.share({title:'Finanças a Dois',text:txt,url}).catch(()=>{});else copiaConvite()}
function copiaConvite(){const url=linkConvite();(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Link do convite copiado 📋')).catch(()=>{const i=$('#convl');if(i){i.focus();i.select()}toast('Selecionado — toque e segure para copiar')})}
function lerConvite(){
  const m=location.hash.match(/^#conectar=([\w-]+)/);if(!m)return;
  history.replaceState(null,'',location.pathname);
  let d;try{d=JSON.parse(b64d(m[1]))}catch(e){toast('Convite inválido');return}
  if(!d.u||!/^https:\/\/script\.google(usercontent)?\.com\//.test(d.u)){toast('Convite inválido');return}
  if(S.cfg.url&&S.cfg.url!==d.u&&!confirm('Este aparelho já está conectado a outra planilha. Trocar pela do convite?'))return;
  S.cfg.url=d.u;S.cfg.token=d.t||'';S.cfg.auto=true;
  if(Array.isArray(d.n)&&d.n.length===2&&(S.cfg.u||0)===0)S.cfg.nomes=d.n;
  saveLocal();toast('💙 Conectado à planilha do casal! Sincronizando…');syncNow(false).then(()=>{render();if(!syncErr)toast('☁️ Dados do casal carregados')});
}

/* ================== SINCRONIZAÇÃO ================== */
function syncData(){const o={del:S.del,cfg:{...S.cfg}};delete o.cfg.url;delete o.cfg.token;delete o.cfg.lastSync;delete o.cfg.auto;COLS.forEach(c=>o[c]=S[c]);return o}
function merge(R){
  if(!R)return;
  Object.entries(R.del||{}).forEach(([k,v])=>S.del[k]=Math.max(S.del[k]||0,v));
  COLS.forEach(c=>{const m=new Map(S[c].map(x=>[x.id,x]));(R[c]||[]).forEach(x=>{const l=m.get(x.id);if(!l||(x.u||0)>(l.u||0))m.set(x.id,x)});S[c]=[...m.values()].filter(x=>!(S.del[x.id]>=(x.u||0)))});
  if(R.cfg&&(R.cfg.u||0)>(S.cfg.u||0)){const keep={url:S.cfg.url,token:S.cfg.token,lastSync:S.cfg.lastSync,auto:S.cfg.auto};S.cfg=Object.assign(blank().cfg,R.cfg,keep);S.cfg.limites=Object.assign(blank().cfg.limites,R.cfg.limites||{})}
  /* limpa tombstones com mais de 90 dias */
  const lim=now()-90*864e5;Object.keys(S.del).forEach(k=>{if(S.del[k]<lim&&!k.startsWith('fx_'))delete S.del[k]});
}
async function syncNow(manual){
  const c=S.cfg;
  if(!c.url){if(manual){toast('Configure a planilha em Mais → Sincronizar');openSub('sync')}return}
  if(!navigator.onLine){if(manual)toast('📴 Sem internet — sincroniza quando voltar');updDot();return}
  if(syncing)return;syncing=true;$('#syncb').classList.add('spin');
  try{
    const r=await fetch(c.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token,data:syncData()})});
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    merge(j.data);S.cfg.lastSync=now();dirty=false;syncErr=false;saveLocal();
    if(!sheetOpen())render();
    if(manual)toast('☁️ Sincronizado com a planilha');
  }catch(e){syncErr=true;if(manual)toast('Erro ao sincronizar: '+(e.message||e))}
  finally{syncing=false;$('#syncb').classList.remove('spin');updDot()}
}
function updDot(){
  const d=$('#sdot');if(!d)return;d.className='';
  if(!S.cfg.url)return;
  if(syncErr)d.className='err';else if(dirty||!navigator.onLine)d.className='pend';else d.className='on';
  const ob=$('#offb');if(ob)ob.style.display=navigator.onLine?'none':'block';
}
addEventListener('online',()=>{updDot();toast('🌐 Online de novo');syncNow(false)});
addEventListener('offline',()=>{updDot();toast('📴 Modo offline')});

/* ================== PULL-TO-REFRESH ================== */
(function(){
  const el=$('#ptr');let y0=null,d=0;
  addEventListener('touchstart',e=>{if(scrollY<=0&&!sheetOpen()){y0=e.touches[0].clientY;d=0}else y0=null},{passive:true});
  addEventListener('touchmove',e=>{if(y0===null)return;d=e.touches[0].clientY-y0;if(d<=0){el.style.opacity=0;return}
    const p=Math.min(d/2,90);el.style.transition='none';el.style.opacity=Math.min(p/60,1);el.style.transform=`translateY(${p-50}px) rotate(${p*4}deg)`},{passive:true});
  addEventListener('touchend',async()=>{if(y0===null)return;y0=null;el.style.transition='transform .25s,opacity .25s';
    if(d>130){el.classList.add('ld');el.style.transform='translateY(20px)';
      await (S.cfg.url?syncNow(true):new Promise(r=>setTimeout(r,500)));
      render();if(!S.cfg.url)toast('Atualizado (dados locais)');el.classList.remove('ld')}
    el.style.transform='translateY(-80px)';el.style.opacity=0;d=0});
})();
/* arrastar sheet para baixo para fechar */
(function(){
  const g=$('#grab'),s=$('#sheet');let y0=null,dy=0;
  g.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;s.style.transition='none'},{passive:true});
  g.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);s.style.transform=`translateY(${dy}px)`},{passive:true});
  g.addEventListener('touchend',()=>{s.style.transition='';if(dy>100)closeSheet();else s.style.transform='';y0=null});
  g.addEventListener('click',closeSheet);
})();
addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet()});

/* ================== UTIL ================== */
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2400)}
